<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Post — SkillBridge</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav id="navbar"></nav>
<main class="container" style="padding:32px 24px;display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start" id="postLayout">
  <article id="postMain"><div class="skeleton" style="height:300px"></div></article>
  <aside id="postSidebar">
    <div class="adsense-slot" data-placement="sidebar" style="margin-bottom:24px"></div>
    <h3 style="font-size:1.1rem;margin-bottom:12px">Recent Posts</h3>
    <div id="recentPosts"></div>
  </aside>
</main>
<footer id="footer"></footer>
<style>
  @media (max-width: 768px) { #postLayout { grid-template-columns: 1fr; } }
</style>
<script src="/js/sb-config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/blog-post.js"></script>
</body>
</html>
