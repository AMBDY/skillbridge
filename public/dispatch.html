<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dispatch Order — SkillBridge</title><link rel="stylesheet" href="/css/styles.css"></head>
<body><nav id="navbar"></nav><main class="auth-wrap" style="align-items:flex-start;padding-top:36px"><div class="auth-card" style="max-width:720px"><h1 class="auth-title">Dispatch information</h1><p class="auth-sub">Add the dispatch evidence and delivery contacts for this paid order.</p><form id="dispatchForm"><div class="form-row"><div class="form-group"><label class="form-label">Tracking number</label><input class="form-input" name="tracking_number"></div><div class="form-group"><label class="form-label">Dispatch date</label><input class="form-input" type="datetime-local" name="dispatch_date" required></div></div><div class="form-row"><div class="form-group"><label class="form-label">Rider / company phone</label><input class="form-input" name="rider_phone" required></div><div class="form-group"><label class="form-label">Second contact (optional)</label><input class="form-input" name="alternate_phone"></div></div><div class="form-row"><div class="form-group"><label class="form-label">Pickup location</label><input class="form-input" name="pickup_location" required></div><div class="form-group"><label class="form-label">Destination</label><input class="form-input" name="destination" required></div></div><div class="form-group"><label class="form-label">Product / packaging images</label><input class="form-input" id="dispatchImages" type="file" accept="image/*" multiple></div><div class="form-group"><label class="form-label">Dispatch notes</label><textarea class="form-textarea" name="description"></textarea></div><button class="btn btn-gold btn-block" type="submit">Submit dispatch</button></form></div></main><footer id="footer"></footer><script src="/js/sb-config.js"></script><script src="/js/app.js"></script><script src="/js/dispatch.js"></script></body></html>
