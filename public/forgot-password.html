<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — SkillBridge</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav id="navbar"></nav>
<div class="auth-wrap">
  <div class="auth-card" style="max-width:440px">
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter the email address used for your account. We will send a secure reset link.</p>
    <form id="forgotPasswordForm">
      <div class="form-group"><label class="form-label" for="resetEmail">Account email</label><input class="form-input" id="resetEmail" type="email" autocomplete="email" required></div>
      <button type="submit" class="btn btn-gold btn-block btn-lg" id="sendResetButton">Send reset link</button>
      <p style="text-align:center;margin-top:16px"><a href="/signin.html" style="color:var(--gold);font-size:.9rem">Back to sign in</a></p>
    </form>
  </div>
</div>
<footer id="footer"></footer>
<script src="/js/sb-config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/forgot-password.js"></script>
</body>
</html>
