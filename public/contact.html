<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — SkillBridge</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav id="navbar"></nav>
<main class="container" style="padding:48px 24px;max-width:640px">
  <span class="eyebrow">Get in Touch</span>
  <h1 class="section-title" id="contactHeading">Contact Us</h1>
  <p class="section-sub" id="contactBody">Questions, feedback, or a partnership idea? Send us a message and a superadmin will follow up.</p>

  <form id="contactForm" style="margin-top:24px">
    <div class="form-group"><label class="form-label">Your name</label><input class="form-input" name="name"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" name="email"></div>
    <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" name="body" rows="5" required></textarea></div>
    <button type="submit" class="btn btn-gold btn-block">Send Message</button>
  </form>
</main>
<footer id="footer"></footer>
<script src="/js/sb-config.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  try {
    const content = await API.get('/marketplace/site-content/contact');
    if (content.heading) document.getElementById('contactHeading').textContent = content.heading;
    if (content.body) document.getElementById('contactBody').textContent = content.body;
  } catch { /* falls back to default text */ }
});
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target));
  if (!data.body?.trim()) return Toast.show('Please write a message');
  try {
    await API.post('/marketplace/comments', data);
    Toast.show('Message sent — thank you!');
    e.target.reset();
  } catch (err) { Toast.show(err.message); }
});
</script>
</body>
</html>
