<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fiat Payment Methods — SkillBridge</title><link rel="stylesheet" href="/css/styles.css"></head><body><nav id="navbar"></nav><main class="container" style="padding:32px 24px;max-width:720px"><div style="font-size:3rem;text-align:center">₦</div><h1 class="section-title" style="text-align:center">Fiat payment methods</h1><p class="section-sub" style="text-align:center">Only payment methods enabled by the superadmin appear here. Online payments are verified server-side.</p><div id="fiatMethods"></div></main><footer id="footer"></footer><script src="/js/sb-config.js"></script><script src="/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('fiatMethods');const methods=await API.get('/marketplace/payment-methods?purpose=product').catch(()=>[]);const fiat=methods.filter(m=>m.method_type!=='crypto_wallet');root.innerHTML=fiat.length?fiat.map(m=>`<div class="card" style="margin:16px 0"><div class="card-body"><h3>${m.display_name}</h3><p>${m.public_details?.description||''}</p>${m.method_type==='fiat_bank'?`<div class="warning-box">Bank: ${m.public_details?.bank_name||'Not configured'}<br>Account name: ${m.public_details?.account_name||'Not configured'}<br>Account number: ${m.public_details?.account_number||'Not configured'}</div><p class="card-meta">Manual proof submission is inactive until a verified payment integration is configured.</p>`:`<p class="card-meta">Use this method from an eligible order or digital-service checkout.</p>`}</div></div>`).join(''):'<p class="card-meta">No fiat method is currently enabled.</p>';});</script></body></html>
