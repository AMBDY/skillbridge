<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Crypto Payment Methods — SkillBridge</title><link rel="stylesheet" href="/css/styles.css"></head><body><nav id="navbar"></nav><main class="container" style="padding:32px 24px;max-width:720px"><div style="font-size:3rem;text-align:center">₿</div><h1 class="section-title" style="text-align:center">Crypto payment methods</h1><p class="section-sub" style="text-align:center">Wallet accounts are configured and replaceable from the superadmin payment-methods control.</p><div id="cryptoMethods"></div></main><footer id="footer"></footer><script src="/js/sb-config.js"></script><script src="/js/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const root=document.getElementById('cryptoMethods');const methods=(await API.get('/marketplace/payment-methods?purpose=product').catch(()=>[])).filter(m=>m.method_type==='crypto_wallet');root.innerHTML=methods.length?methods.map(m=>`<div class="card" style="margin:16px 0"><div class="card-body"><h3>${m.display_name}</h3><p class="card-meta">${m.currency}${m.network?' · '+m.network:''}</p><div class="warning-box"><strong>Wallet:</strong> <span id="wallet-${m.method_code}">${m.public_details?.wallet_address||'Not configured'}</span></div><button class="btn btn-outline btn-sm" data-wallet="wallet-${m.method_code}">Copy wallet</button><p class="card-meta" style="margin-top:10px">Manual proof submission is inactive until this method has a verified provider integration.</p></div></div>`).join(''):'<p class="card-meta">No crypto wallet is currently enabled.</p>';root.querySelectorAll('[data-wallet]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(document.getElementById(b.dataset.wallet).textContent).then(()=>Toast.show('Wallet copied')));});</script></body></html>
