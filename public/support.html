<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — SkillBridge</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav id="navbar"></nav>
<main class="container" style="padding:32px 24px;max-width:760px">
  <h1 class="section-title">Support</h1>
  <p class="section-sub">Open a ticket and we'll get back to you here.</p>

  <div class="card" style="margin:20px 0"><div class="card-body">
    <h3>New ticket</h3>
    <form id="newTicketForm">
      <div class="form-group"><label class="form-label">Subject</label><input class="form-input" name="subject" required></div>
      <div class="form-group"><label class="form-label">Priority</label>
        <select class="form-select" name="priority"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select>
      </div>
      <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea" name="body" rows="4" required></textarea></div>
      <button type="submit" class="btn btn-gold">Submit Ticket</button>
    </form>
  </div></div>

  <h3 style="margin-top:32px">Your tickets</h3>
  <div id="ticketList" style="margin-top:12px"></div>
  <div id="ticketThread" style="margin-top:24px"></div>
</main>
<footer id="footer"></footer>
<script src="/js/sb-config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/support.js"></script>
</body>
</html>
