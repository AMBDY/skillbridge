<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proof of Payment — SkillBridge</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav id="navbar"></nav>
<div class="auth-wrap" style="align-items:flex-start;padding-top:48px">
  <div class="auth-card" style="max-width:560px">
    <h1 class="auth-title">Proof of Payment</h1>
    <p class="auth-sub">Upload proof so the platform can verify and hold funds in escrow.</p>
    <!-- Payment-proof submission is intentionally inactive. Product payments must
         use a configured provider and server-side verification. -->
    <form id="proofForm" onsubmit="return false;" aria-disabled="true">
      <fieldset disabled style="border:0;margin:0;padding:0">
      <div class="form-row">
        <div class="form-group"><label class="form-label">Full name</label><input class="form-input" name="full_name" required></div>
        <div class="form-group"><label class="form-label">Display/account name</label><input class="form-input" name="display_name" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Freelancer/worker name</label><input class="form-input" name="freelancer_name" required></div>
        <div class="form-group"><label class="form-label">Payment type</label><select class="form-select" name="payment_type"><option>Crypto (USDT)</option><option>Bank Transfer</option><option>Paystack</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Product/service</label><input class="form-input" name="product_service" required></div>
        <div class="form-group"><label class="form-label">Amount (₦)</label><input class="form-input" type="number" name="amount" required></div>
      </div>
      <div class="form-group"><label class="form-label">Job duration</label><input class="form-input" name="job_duration"></div>
      <div class="form-group"><label class="form-label">Payment proof (screenshot/receipt)</label>
        <input class="form-input" type="file" id="proofFileInput" accept="image/*,.pdf" required>
        <div id="proofPreview" style="margin-top:8px"></div>
      </div>
      <button type="button" class="btn btn-outline btn-block btn-lg" disabled>Payment proof submission unavailable</button>
      </fieldset>
    </form>
  </div>
</div>
<footer id="footer"></footer>
<script src="/js/sb-config.js"></script>
<script src="/js/app.js"></script>
<script>
document.getElementById('proofFileInput').addEventListener('change', () => {
  const file = document.getElementById('proofFileInput').files[0];
  if (!file) return;
  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = () => { document.getElementById('proofPreview').innerHTML = `<img src="${reader.result}" style="max-width:200px;border-radius:8px">`; };
    reader.readAsDataURL(file);
  } else {
    document.getElementById('proofPreview').textContent = file.name;
  }
});

document.getElementById('proofForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  return Toast.show('Payment proof submission is inactive. Use the verified payment provider when it is configured.');
  /* Legacy proof-upload code is deliberately unreachable while provider verification is required.

  const params = new URLSearchParams(location.search);
  const purpose = params.get('purpose') || 'escrow';
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = 'Uploading...';

    const proof_url = await Upload.file(file);
    btn.textContent = 'Submitting...';
    if (params.get('payment')) {

    } else {
      await API.post('/payments', {

      Toast.show(params.get('payment') ? 'Proof submitted for administrator verification.' : 'Proof submitted! Funds held in escrow.');
      setTimeout(() => location.href = params.get('order') ? `/order.html?id=${params.get('order')}` : '/dashboard.html', 1200);
    }
  } catch (err) {
    Toast.show(err.message);
    btn.disabled = false; btn.textContent = 'Submit Proof';
  } */

</script>
</body>
</html>
