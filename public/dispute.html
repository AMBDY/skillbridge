<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disputes — SkillBridge</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<nav id="navbar"></nav>
<main class="container" style="padding:32px 24px;max-width:760px">
  <h1 class="section-title">Disputes</h1>
  <p class="section-sub" id="disputeSub">Raise an issue with a job or payment. Superadmin reviews every dispute.</p>

  <div class="card" id="newDisputeCard" style="margin:20px 0;display:none"><div class="card-body">
    <h3>Raise a dispute</h3>
    <p id="disputeContext" style="color:var(--text-muted);font-size:0.9rem"></p>
    <form id="disputeForm">
      <div class="form-group"><label class="form-label">What went wrong?</label><textarea class="form-textarea" name="reason" rows="4" required placeholder="Describe the issue in detail — this goes straight to a superadmin for review."></textarea></div>
      <button type="submit" class="btn btn-gold">Submit Dispute</button>
    </form>
  </div></div>

  <h3 style="margin-top:32px">Your disputes</h3>
  <div id="disputeList" style="margin-top:12px"></div>
</main>
<footer id="footer"></footer>
<script src="/js/sb-config.js"></script>
<script src="/js/app.js"></script>
<script src="/js/dispute.js"></script>
</body>
</html>
